name: Python PostgreSQL current LASO main

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python-postgres-browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laso_ci
          POSTGRES_PASSWORD: laso_ci_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laso_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      LASO_E2E_LASO_COUNT: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create isolated database role and databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: laso_ci
          PGPASSWORD: laso_ci_test_only
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          APP_PASSWORD: laso_ci_test_only
        run: |
          echo "::add-mask::${APP_PASSWORD}"
          suffix="${RUN_ID}_${RUN_ATTEMPT}"
          role="laso_web_${suffix}"
          database="laso_web_main_${suffix}"
          context_database="laso_web_ctx_${suffix}"
          schema="laso_web_${suffix}"
          psql -d postgres -v ON_ERROR_STOP=1 -v role="$role" -v database="$database" -v context_database="$context_database" -v app_password="$APP_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'role', :'app_password') \gexec
          SELECT format('CREATE DATABASE %I OWNER %I', :'database', :'role') \gexec
          SELECT format('CREATE DATABASE %I OWNER %I', :'context_database', :'role') \gexec
          SQL
          echo "LASO_E2E_POSTGRES_DSN=host=127.0.0.1 port=5432 dbname=${database} user=${role} password=laso_ci_test_only" >> "$GITHUB_ENV"
          echo "LASO_E2E_POSTGRES_SCHEMA=${schema}" >> "$GITHUB_ENV"
      - name: Install LASO PostgreSQL and browser dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libpq-dev libpqxx-dev libyaml-cpp-dev nlohmann-json3-dev libspdlog-dev libcli11-dev libboost-system-dev postgresql-client
      - name: Check out the audited current LASO main
        run: |
          git clone --no-checkout https://github.com/Registered-Agent-Attorney/LASO.git ../LASO
          git -C ../LASO fetch --depth=1 origin 65bb0b849351d3322413644f546556e116509372
          git -C ../LASO checkout --detach 65bb0b849351d3322413644f546556e116509372
          test "$(git -C ../LASO rev-parse HEAD)" = 65bb0b849351d3322413644f546556e116509372
      - name: Build LASO, install browser dependencies, and check Python application
        run: |
          cmake -S ../LASO -B ../LASO/build-postgres-e2e -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF -DLASO_INSTALL_SYSTEMD_UNIT=OFF
          cmake --build ../LASO/build-postgres-e2e --target laso-server --parallel 2
          npm ci
          npx playwright install --with-deps chromium
          python -m py_compile server.py tests/*.py
          python -m unittest discover -s tests -v
          npm test
      - name: Run PostgreSQL-backed Python frontend and two-LASO browser acceptance
        env:
          LASO_SOURCE_DIR: ../LASO
          LASO_E2E_LASO_SERVER: ../LASO/build-postgres-e2e/bin/laso-server
        run: npm run test:e2e
      - name: Run isolated PostgreSQL context-reduction browser acceptance
        env:
          LASO_E2E_LASO_COUNT: 2
          LASO_E2E_CONTEXT_REDUCTION: 1
          LASO_E2E_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=laso_web_ctx_${{ github.run_id }}_${{ github.run_attempt }} user=laso_web_${{ github.run_id }}_${{ github.run_attempt }} password=laso_ci_test_only
          LASO_E2E_POSTGRES_SCHEMA: laso_ctx_${{ github.run_id }}_${{ github.run_attempt }}
          LASO_SOURCE_DIR: ../LASO
          LASO_E2E_LASO_SERVER: ../LASO/build-postgres-e2e/bin/laso-server
        run: npm run test:e2e -- --grep "PostgreSQL candidate"
      - name: Remove traces containing test authentication headers
        if: failure()
        run: |
          find test-results -type f -name '*.zip' -delete
          rm -rf playwright-report
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-postgres-browser-failure-artifacts
          path: |
            test-results/
          if-no-files-found: ignore
